<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3929" />
      <stop offset="55%" stop-color="#14533C" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E3929" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Pebble / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pawGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Ring Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2" />

  <!-- 4 Paw Toe Pads with Organic Tilt -->
  <!-- Left Outer Toe -->
  <ellipse cx="20.5" cy="22" rx="3.5" ry="4.8" transform="rotate(-24 20.5 22)" fill="#FFFFFF" fill-opacity="0.95" />
  <!-- Left Center Toe -->
  <ellipse cx="28" cy="17" rx="3.8" ry="5.2" transform="rotate(-8 28 17)" fill="#FFFFFF" fill-opacity="0.98" />
  <!-- Right Center Toe -->
  <ellipse cx="36.5" cy="17.5" rx="3.8" ry="5.2" transform="rotate(10 36.5 17.5)" fill="#FFFFFF" fill-opacity="0.98" />
  <!-- Right Outer Toe -->
  <ellipse cx="43.5" cy="23" rx="3.5" ry="4.8" transform="rotate(26 43.5 23)" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Central Paw Pad intertwined with Open Heart & Loop -->
  <path d="M 23 35.5 C 21 31 24.5 27 28.5 27 C 31 27 33 28.5 34 30 C 35 28.5 37 27 39.5 27 C 43.5 27 47 31 45 35.5 C 43 40 37 45.5 34 47.5 C 31 45.5 25 40 23 35.5 Z" 
        fill="#FFFFFF" />

  <!-- Embracing Heart Connection Ribbon -->
  <path d="M 33 46 C 39 48 48 45 49 37 C 50 29 44 26 41 27 C 45 28.5 47 33 45.5 37.5 C 44 42 38 44 33 43 C 27 42 22 36.5 23.5 31 C 24 29 25.5 27.5 27.5 27" 
        stroke="url(#heartGrad)" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Small Adoption Spark / Dot of Connection -->
  <circle cx="48" cy="25" r="2.2" fill="#FBBF24" />
</svg>
